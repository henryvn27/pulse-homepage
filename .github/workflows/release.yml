name: Release standalone homepage

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check customization behavior
        run: npm run check:customization

      - name: Build standalone homepage
        run: npm run build:single

      - name: Attach standalone homepage to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ../pulse-homepage.html --repo "$GITHUB_REPOSITORY" --clobber
